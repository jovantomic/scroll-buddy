<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timothy / 3D Blender model</title><style>*{box-sizing:border-box}body{margin:0;background:#f2eef8;color:#312641;font:14px system-ui,sans-serif;height:420vh}main{position:sticky;top:0;height:100svh;overflow:hidden}header{position:absolute;top:26px;left:5%;z-index:3}header small{letter-spacing:2px;font-size:10px;color:#8c71aa}h1{font-size:38px;letter-spacing:-2px;margin:8px 0}model-viewer{display:block;width:100%;height:100%;--poster-color:#f2eef8;background:radial-gradient(ellipse,#f8f5fd,#e9e0f3)}.panel{position:absolute;top:28px;right:5%;z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:45%}button,select,a{font:12px system-ui;color:#665080;border:1px solid #d9cce7;background:#faf7ff;border-radius:20px;padding:11px 17px;text-decoration:none;cursor:pointer}.footer{position:absolute;bottom:30px;left:5%;right:5%;display:flex;justify-content:space-between;align-items:center;gap:18px;color:#897797;font-size:11px}.downloads{display:flex;gap:8px}.line{position:absolute;bottom:0;left:0;right:0;height:3px;background:#e0d2ed}.line i{display:block;height:100%;background:#8d62cb;transform:scaleX(0);transform-origin:left}#status{margin-top:8px;font-size:11px;color:#9985aa}#note{max-width:260px;line-height:1.6}button.active{background:#7b58ae;color:white}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #9678bc;outline-offset:3px}@media(max-width:650px){header{top:18px}h1{font-size:27px}.panel{top:115px;left:5%;right:5%;max-width:none}model-viewer{padding-top:60px}.footer{bottom:22px;align-items:flex-end}.downloads{flex-direction:column}.downloads a{padding:8px 13px}#note{max-width:160px;font-size:10px}}</style><script type="module" src="vendor/model-viewer.min.js"></script></head><body><main><header><small>BLENDER / GLB / REAL 3D</small><h1>Timothy.</h1><div id="status" role="status">Učitavam model…</div></header><div class="panel"><select id="action" aria-label="Animacija"><option>Idle</option><option>Run</option><option>Wave</option><option>Jump</option><option>Celebrate</option></select><button id="play">Pusti</button><button id="scroll" class="active">Skrol: uključen</button></div><model-viewer id="model" src="timothy.glb" alt="Pravi 3D model Timothyja, dečaka sa ljubičastom kapom, slušalicama i duksom, i njegovom čupavom kuglom" camera-controls shadow-intensity="1" exposure="1" camera-orbit="25deg 78deg auto" interaction-prompt="none" environment-image="neutral" animation-name="Idle"></model-viewer><div class="footer"><div id="note">Skroluj za rotaciju modela i animaciju. Povuci mišem za slobodan pogled.</div><div class="downloads"><a href="timothy.blend" download>Blender ↓</a><a href="timothy.glb" download>GLB ↓</a></div></div><div class="line"><i></i></div></main><script src="vendor/gsap.min.js"></script><script src="vendor/ScrollTrigger.min.js"></script><script src="vendor/lenis.min.js"></script><script>
const model=document.querySelector('#model'),status=document.querySelector('#status'),selector=document.querySelector('#action');let loaded=false,scrolling=true,playing=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const lenis=new Lenis({lerp:.09,smoothWheel:!reduced});gsap.registerPlugin(ScrollTrigger);lenis.on('scroll',ScrollTrigger.update);gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0);
function applyScroll(){if(!loaded||!scrolling)return;const p=window.scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight);model.pause();model.currentTime=p*Math.max(.01,model.duration);if(!reduced)model.cameraOrbit=`${25+p*360}deg 78deg auto`;gsap.set('.line i',{scaleX:p});}
model.addEventListener('load',()=>{loaded=true;selector.innerHTML='';for(const name of model.availableAnimations){const o=document.createElement('option');o.textContent=name;selector.append(o)}selector.value='Idle';model.animationName='Idle';status.textContent='3D model učitan · '+model.availableAnimations.length+' animacija';applyScroll();});
model.addEventListener('error',()=>status.textContent='Model nije učitan. Otvori ovaj folder preko HTTP servera.');
selector.onchange=()=>{model.animationName=selector.value;if(scrolling)requestAnimationFrame(applyScroll);else model.play();};
document.querySelector('#scroll').onclick=e=>{scrolling=!scrolling;e.target.classList.toggle('active',scrolling);e.target.textContent='Skrol: '+(scrolling?'uključen':'isključen');if(scrolling){applyScroll();playing=false}else{model.play();playing=true}document.querySelector('#play').textContent=playing?'Pauza':'Pusti';};
document.querySelector('#play').onclick=e=>{if(scrolling){scrolling=false;document.querySelector('#scroll').classList.remove('active');document.querySelector('#scroll').textContent='Skrol: isključen'}playing=!playing;if(playing)model.play();else model.pause();e.target.textContent=playing?'Pauza':'Pusti';};
addEventListener('scroll',applyScroll,{passive:true});
</script></body></html>
