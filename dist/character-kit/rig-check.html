<!doctype html><html><head><meta charset="utf-8"><title>Rig pose check</title><style>body{margin:0;background:#f4f0fa;font:12px sans-serif}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}.cell{height:420px;background:#faf8fc;border:1px solid #ddd5e8;text-align:center;overflow:hidden}.puppet{width:220px;height:330px;margin:60px auto 0}.label{height:24px;padding-top:6px}h1{font-size:16px;margin:15px}button{margin:10px}</style></head><body><h1>All motions / fixed poses / closed ends and connected pivots</h1><div class="grid"></div><script type="module">
import {mountBuddy} from './character.js?v=4';
const poses=[['run',0],['run',.125],['run',.25],['run',.375],['run',.5],['run',.625],['run',.75],['run',.875],['wave',0],['wave',.25],['jump',.25],['jump',.5],['walk',.25],['point',0],['dance',.25],['idle',0]];
for(const [motion,t] of poses){const cell=document.createElement('div');cell.className='cell';const label=document.createElement('div');label.className='label';label.textContent=motion+' / '+t+'s';const el=document.createElement('div');el.className='puppet';cell.append(label,el);document.querySelector('.grid').append(cell);const buddy=await mountBuddy(el);buddy.poseAt(motion,t);}
</script></body></html>
